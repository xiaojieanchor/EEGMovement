server {
 listen 18443 ssl;
 listen 443 ssl default_server;
 server_name 106.55.251.83;
 ssl_certificate /etc/eeg-relay/server.pem;
 ssl_certificate_key /etc/eeg-relay/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 server_tokens off;
 access_log off;
 client_max_body_size 5m;
 location ^~ /eeg/updates/ {
  alias /srv/www/eeg-updates/;
  autoindex off;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  limit_rate 96k;
 }
 location ^~ /eeg/releases/ {
  alias /srv/www/eeg-releases/;
  autoindex off;
  default_type application/octet-stream;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  limit_rate 96k;
 }
 location ^~ /eeg/ {
  proxy_pass http://127.0.0.1:18767;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 45s;
  proxy_send_timeout 10s;
 }
 location / { return 404; }
}
